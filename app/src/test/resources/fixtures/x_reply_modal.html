<html><body><div id="react-root">
<header role="banner"><nav><a data-testid="AppTabBar_Profile_Link" href="/Me_Account">Profile</a>

  <button data-testid="SideNav_AccountSwitcher_Button">Me Account @Me_Account</button></header>
<main><div data-testid="primaryColumn"><section aria-label="Timeline: Conversation">
  <div data-testid="cellInnerDiv"><article data-testid="tweet" tabindex="-1">

    <div data-testid="tweetText">What do you all think?</div>
    <a href="/alice/status/100"><time datetime="2026-10-03T09:00:00Z">9:00</time></a>

      <div data-testid="tweetTextarea_0" role="textbox" contenteditable="true" aria-label="Post text"><span>Great point!</span></div>
    </div>
    <div data-testid="toolBar">
      <div role="tablist">
        <button data-testid="fileInput" aria-label="Add photos or video"></button>

        <button data-testid="createPollButton" aria-label="Add poll"></button>
        <button aria-label="Add emoji"></button>
        <button data-testid="scheduleOption" aria-label="Schedule post"></button>
        <button data-testid="geoButton" aria-label="Tag location"></button>
      </div>
      <button data-testid="tweetButtonInline" role="button">Reply</button>
    </div>
  </div></div>
  <div data-testid="cellInnerDiv"><article data-testid="tweet" tabindex="0">
    <div data-testid="User-Name"><a href="/bob">Bob</a></div>
    <a href="/bob/status/101"><time>5m</time></a><div data-testid="tweetText">Looks great</div>
    <button data-testid="reply" aria-label="Reply"></button>
  </article></div>
</section></div>
<div data-testid="sidebarColumn"><button data-testid="tweetButton">Post</button></div></main>
<div id="layers"><div role="dialog" aria-modal="true" aria-labelledby="modal-header">
  <div><button data-testid="app-bar-close" aria-label="Close"></button></div>
  <div>Replying to <a href="/alice">@alice</a></div>
  <div data-testid="tweetTextarea_0RichTextInputContainer">
    <div data-testid="tweetTextarea_0" role="textbox" contenteditable="true" aria-label="Post text"></div>
  </div>
  <div data-testid="toolBar">
    <button data-testid="scheduleOption" aria-label="Schedule post"></button>
    <button data-testid="gifSearchButton" aria-label="Add a GIF"></button>
    <button data-testid="tweetButton" role="button" aria-disabled="true">Reply</button>
